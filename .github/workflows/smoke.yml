name: smoke

# WHAT A STRANGER GETS. Every other workflow here builds the editor and then
# checks what it built, on a machine that has Lazarus, FPC and both repositories
# on it. This one has none of those and never touches the source: it DOWNLOADS
# THE PUBLISHED ARCHIVE and runs it, on a runner image that has never compiled
# anything of ours.
#
# NO `actions/checkout`, DELIBERATELY. The moment this job can see the tree it
# stops answering the question it exists for. Everything it needs comes out of
# the release.
#
# IT ALSO RUNS WITH NO `phosphor` BINARY ANYWHERE, which is the first-run state
# for anybody who downloads the editor before the interpreter. The release notes
# claim the editor still opens and edits in that state; this is what turns that
# claim into an exit code.
#
# Manual, not on push: it tests a published release, and a release does not change
# when main does.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to smoke-test (blank = latest)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Say what this machine is
        shell: bash
        run: |
          echo "runner: ${{ runner.os }} ${{ runner.arch }}"
          uname -a || ver
          echo "--- is anything of ours already here? ---"
          command -v lazbuild && echo "LAZBUILD PRESENT -- this is not a clean machine" || echo "no lazbuild"
          command -v fpc      && echo "FPC PRESENT -- this is not a clean machine"      || echo "no fpc"
          command -v phosphor && echo "PHOSPHOR ON PATH -- not the first-run state"     || echo "no phosphor on PATH"

      - name: Download the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ github.event.inputs.tag }}'
          if [ -z "$tag" ]; then
            tag="$(gh release view --repo ${{ github.repository }} --json tagName -q .tagName)"
          fi
          echo "tag: $tag"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          mkdir -p dl && cd dl
          if [ "${{ runner.os }}" = "Windows" ]; then
            gh release download "$tag" --repo ${{ github.repository }} --pattern '*windows*'
          else
            gh release download "$tag" --repo ${{ github.repository }} --pattern '*linux*'
          fi
          ls -l

      - name: Unpack, the way a person would
        shell: bash
        run: |
          mkdir -p app && cd dl
          if [ "${{ runner.os }}" = "Windows" ]; then
            unzip -q phosphoride-windows-x86_64.zip -d ../app
          else
            tar -xzf phosphoride-linux-x86_64.tar.gz -C ../app
          fi
          cd ../app && ls -l
          test -f LICENSE          || { echo "the archive is missing LICENSE"; exit 1; }
          test -f README.md        || { echo "the archive is missing README.md"; exit 1; }
          test -f getting-started.md || { echo "the archive is missing the guide"; exit 1; }

      # THE DEPENDENCY QUESTION, and it is the one a clean machine exists to
      # answer. The release notes tell a Linux user they need the gtk2 runtime;
      # this prints what the binary actually asks the loader for, and fails if
      # anything is unresolved -- so the claim in the notes is measured rather
      # than believed.
      # THE DEPENDENCY QUESTION, and it is the one a clean machine exists to
      # answer. Measured 2026-09-18 on a stock Ubuntu 24.04 runner: this binary
      # does NOT load -- libgtk-x11-2.0.so.0 and libgdk-x11-2.0.so.0 are both
      # `not found`. GTK 2 has not been part of a default Ubuntu install for
      # years, so the release notes' "most desktops already have it" was false
      # for anybody on a current distribution: they would have downloaded the
      # editor, double-clicked, and seen nothing happen.
      #
      # This step REPORTS rather than fails, because the next one is what turns
      # the documented instruction into a test.
      - name: What does it need from this machine (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x app/phosphoride
          echo "--- ldd, before anything is installed ---"
          ldd app/phosphoride || true
          missing="$(ldd app/phosphoride 2>/dev/null | grep 'not found' || true)"
          echo ""
          if [ -n "$missing" ]; then
            echo "UNRESOLVED on a stock $(. /etc/os-release && echo $PRETTY_NAME):"
            echo "$missing"
          else
            echo "every shared library already resolves on a stock runner"
          fi

      # THE INSTRUCTION IN THE RELEASE NOTES, RUN AS WRITTEN. If a user has to do
      # this, the job has to do it too -- and it has to discover the package name
      # rather than assert one, because Ubuntu 24.04's 64-bit time_t transition
      # renamed a great many runtime packages with a `t64` suffix. Whichever name
      # resolves here is the one the notes must carry.
      - name: Install what a user would be told to install (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if sudo apt-get install -y libgtk2.0-0 2>/dev/null; then
            echo "PACKAGE=libgtk2.0-0" >> "$GITHUB_ENV"
          elif sudo apt-get install -y libgtk2.0-0t64; then
            echo "PACKAGE=libgtk2.0-0t64" >> "$GITHUB_ENV"
          else
            echo "neither libgtk2.0-0 nor libgtk2.0-0t64 could be installed"
            exit 1
          fi
          sudo apt-get install -y xvfb

      - name: And now nothing is unresolved (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "installed: $PACKAGE"
          missing="$(ldd app/phosphoride 2>/dev/null | grep 'not found' || true)"
          if [ -n "$missing" ]; then
            echo "STILL UNRESOLVED after the documented install:"
            echo "$missing"
            exit 1
          fi
          echo "every shared library resolves after installing $PACKAGE"

      # --selftest CONSTRUCTS EVERY FORM. If the download runs at all, this is
      # what says it runs correctly -- and it needs no phosphor binary, which is
      # exactly the state being tested.
      - name: Run it, with no phosphor anywhere (Linux)
        if: runner.os == 'Linux'
        run: |
          cd app
          xvfb-run -a timeout 90 ./phosphoride --selftest ./report.txt
          echo "exit=$?"
          cat report.txt

      - name: Run it, with no phosphor anywhere (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd app
          $p = Start-Process .\phosphoride.exe -PassThru -ArgumentList '--selftest', "$PWD\report.txt"
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw 'the downloaded binary hung' }
          if ($p.ExitCode -ne 0) { throw "selftest exit $($p.ExitCode)" }
          Get-Content report.txt

      - name: Say what was proved
        shell: bash
        run: |
          echo "PhosphorIDE $TAG downloaded on a machine with no Lazarus, no FPC,"
          echo "no source tree and no phosphor binary, unpacked, and constructed"
          echo "every one of its forms."
